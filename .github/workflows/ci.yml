name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Start Telegraf
      run: |
        docker run -d \
          --name telegraf \
          -p 8089:8089/udp \
          -v ${{ github.workspace }}/telegraf.conf:/etc/telegraf/telegraf.conf \
          telegraf:latest
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync
    
    - name: Install maturin
      run: uv pip install maturin
    
    - name: Install pytest
      run: uv pip install pytest
    
    - name: Build wheel
      run: uv run maturin build --release
    
    - name: List available wheels
      run: ls -la target/wheels/
    
    - name: Install the built package
      run: |
        WHEEL_FILE=$(ls -1t target/wheels/telegraf_client-*.whl | head -1)
        if [ -z "$WHEEL_FILE" ]; then
          echo "No built wheel found in target/wheels"
          exit 1
        fi
        echo "Installing wheel: $WHEEL_FILE"
        uv pip install --reinstall "$WHEEL_FILE"
    
    - name: Run tests
      run: |
        sleep 5
        uv run pytest

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-py${{ matrix.python-version }}
        path: target/wheels/*.whl