[package]
name = "telegraf-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "telegraf_client"
crate-type = ["cdylib"]

[dependencies]
telegraf = "0.6.0"
pyo3 = { version = "0.30", features = ["extension-module"] }

# ponytail: rustc < 1.98 strips release Mach-O with a 4-byte-aligned LINKEDIT
# string pool; macOS 27 dyld refuses to load it. Drop when rustc >= 1.98.
[profile.release]
strip = "none"